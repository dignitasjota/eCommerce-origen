services:
  # ── Aplicación Next.js ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce:latest
    container_name: ecommerce-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexión interna al servicio db (DNS automático en la red de compose).
      DATABASE_URL: "mysql://${MYSQL_USER:-ecommerce}:${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-ecommerce}"
      # NextAuth — generar con: openssl rand -base64 32
      NEXTAUTH_URL: "${NEXTAUTH_URL:?Falta NEXTAUTH_URL (ej. https://tienda.tudominio.com)}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Falta NEXTAUTH_SECRET}"
      NEXT_PUBLIC_APP_URL: "${NEXTAUTH_URL}"
      # Bootstrap del primer admin — sólo se usa si la BD está vacía.
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Secret para endpoints /api/admin/cron/*. Sin valor → cron deshabilitado.
      CRON_SECRET: "${CRON_SECRET:-}"
      # Sentry (opcional). Vacío → integración inactiva, sin coste.
      SENTRY_DSN: "${SENTRY_DSN:-}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
      SENTRY_ENV: "${SENTRY_ENV:-production}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.05}"
    volumes:
      # Uploads de imágenes (productos, categorías, banners) — persistente.
      - uploads:/app/public/uploads
      # Temas .css subidos desde el admin.
      - themes:/app/public/themes
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ecommerce-net

  # ── Base de datos MariaDB ──────────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${MYSQL_DATABASE:-ecommerce}"
      MARIADB_USER: "${MYSQL_USER:-ecommerce}"
      MARIADB_PASSWORD: "${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net
    # Sin `ports:` deliberadamente: la BD sólo es accesible desde la red
    # interna de docker. Para administración externa, exponer condicionalmente
    # con `docker compose --profile admin up`.

  # ── Backup automatizado de la BD ───────────────────────────────────────
  # Side-car que ejecuta mariadb-dump cada noche y guarda dumps comprimidos
  # en el volumen `db-backups`. Retención configurable con BACKUP_KEEP_DAYS
  # (default 30 días). Para desactivar el backup (ej. en dev local), levantar
  # el stack sin el perfil:
  #   docker compose up -d                  # NO arranca backup
  #   docker compose --profile backup up -d # SÍ arranca backup
  backup:
    image: mariadb:10.11
    container_name: ecommerce-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-ecommerce}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-30}"
      BACKUP_CRON: "${BACKUP_CRON:-0 3 * * *}" # default: 03:00 UTC diario
    volumes:
      - db-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # Construir crontab con el horario configurado.
        echo "$$BACKUP_CRON /usr/local/bin/run-backup.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root

        # Script de backup: dump comprimido con timestamp + purgar antiguos.
        cat > /usr/local/bin/run-backup.sh <<'BACKUP_SCRIPT'
        #!/bin/sh
        set -eu
        TS=$$(date +%Y%m%d-%H%M%S)
        FILE="/backups/$${MYSQL_DATABASE}-$${TS}.sql.gz"
        echo "[backup] $$(date -Iseconds) starting → $$FILE"
        mariadb-dump \
          -h db -u root -p"$$MYSQL_ROOT_PASSWORD" \
          --single-transaction --quick --routines --triggers --events \
          "$$MYSQL_DATABASE" | gzip -9 > "$$FILE"
        SIZE=$$(stat -c%s "$$FILE" 2>/dev/null || echo 0)
        echo "[backup] $$(date -Iseconds) done — $$SIZE bytes"
        # Retención: borrar dumps más antiguos que BACKUP_KEEP_DAYS.
        find /backups -type f -name '*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
        echo "[backup] retention applied (keep $${BACKUP_KEEP_DAYS} days)"
        BACKUP_SCRIPT
        chmod +x /usr/local/bin/run-backup.sh

        # Hacer un backup inmediato al primer arranque para verificar que la
        # configuración funciona, luego pasar el control a crond.
        /usr/local/bin/run-backup.sh || echo "[backup] initial backup failed (continuing)"

        # crond en foreground con log a stdout para que aparezca en docker logs.
        crond -f -l 8
    networks:
      - ecommerce-net

volumes:
  db-data:
    driver: local
  db-backups:
    driver: local
  uploads:
    driver: local
  themes:
    driver: local

networks:
  ecommerce-net:
    driver: bridge
