name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Cancelar runs antiguos si llega un push nuevo a la misma rama.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ─── Typecheck + Lint ────────────────────────────────────────────────
    quality:
        name: Quality (typecheck + lint)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci --ignore-scripts
            - name: Generate Prisma client
              # Necesario para que tsc y eslint resuelvan tipos de @prisma/client.
              # DATABASE_URL es un placeholder — sólo se usa para generate, no para conectar.
              env:
                  DATABASE_URL: 'mysql://placeholder:placeholder@placeholder:3306/placeholder'
              run: npx prisma generate
            - name: TypeScript check
              run: npx tsc --noEmit
            - name: ESLint
              run: npm run lint -- --max-warnings=0
              continue-on-error: true # Lint no bloquea hasta limpiar warnings legacy

    # ─── Tests E2E con Playwright ────────────────────────────────────────
    e2e:
        name: Playwright E2E
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Servicio MariaDB efímero para que la app pueda arrancar y los tests
        # puedan ejecutar el flujo completo (incluido el bootstrap automático).
        services:
            mariadb:
                image: mariadb:10.11
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: ecommerce_test
                    MARIADB_USER: ecommerce
                    MARIADB_PASSWORD: ecommerce
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci
            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Apply schema to test DB
              env:
                  DATABASE_URL: 'mysql://ecommerce:ecommerce@127.0.0.1:3306/ecommerce_test'
              run: npx prisma db push --accept-data-loss=false --skip-generate

            - name: Seed bootstrap (admin + defaults)
              env:
                  DATABASE_URL: 'mysql://ecommerce:ecommerce@127.0.0.1:3306/ecommerce_test'
                  ADMIN_EMAIL: 'ci-admin@example.com'
                  ADMIN_PASSWORD: 'CiTestPass123!'
              run: node ./scripts/seed-bootstrap.mjs

            - name: Build Next.js
              env:
                  DATABASE_URL: 'mysql://ecommerce:ecommerce@127.0.0.1:3306/ecommerce_test'
                  NEXTAUTH_URL: 'http://localhost:3000'
                  NEXTAUTH_SECRET: 'ci-test-secret-not-real-replace-in-prod-32-chars'
                  NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
                  NEXT_TELEMETRY_DISABLED: '1'
              run: npm run build

            - name: Run Playwright tests
              env:
                  DATABASE_URL: 'mysql://ecommerce:ecommerce@127.0.0.1:3306/ecommerce_test'
                  NEXTAUTH_URL: 'http://localhost:3000'
                  NEXTAUTH_SECRET: 'ci-test-secret-not-real-replace-in-prod-32-chars'
                  NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
                  NEXT_TELEMETRY_DISABLED: '1'
                  E2E_ADMIN_EMAIL: 'ci-admin@example.com'
                  E2E_ADMIN_PASSWORD: 'CiTestPass123!'
                  # Stripe webhook secret de test (no real). Lo usa tanto el endpoint
                  # como el helper que firma payloads en `07-stripe-webhook.spec.ts`.
                  STRIPE_WEBHOOK_SECRET: 'whsec_test_e2e_only_not_a_real_secret'
                  E2E_STRIPE_WEBHOOK_SECRET: 'whsec_test_e2e_only_not_a_real_secret'
                  # Stripe secret key (formato test) — `getStripe()` necesita un valor
                  # plausible para instanciar el SDK. No conecta a Stripe real porque
                  # los specs sólo invocan el verificador de firmas.
                  STRIPE_SECRET_KEY: 'sk_test_e2e_only_not_a_real_secret'
                  CI: 'true'
              run: npm run test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

    # ─── Build Docker ────────────────────────────────────────────────────
    docker-build:
        name: Build Docker image
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Sólo bloquea el merge si quality pasa. e2e puede ser flaky en CI sin
        # afectar la imagen, así que no lo hacemos pre-requisito.
        needs: [quality]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build (no push)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  load: true
                  tags: ecommerce:ci-${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Smoke test mínimo: la imagen arranca y `tini` recibe SIGTERM bien.
            # No probamos contra una BD aquí — sólo que el binario corre.
            - name: Image smoke test
              run: |
                  docker images ecommerce:ci-${{ github.sha }}
                  # Ejecutamos `node --version` dentro de la imagen para verificar
                  # que las capas básicas están bien copiadas.
                  docker run --rm --entrypoint node ecommerce:ci-${{ github.sha }} --version

    # ─── Push a registry (sólo en tags vX.Y.Z) ───────────────────────────
    docker-publish:
        name: Publish Docker image
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [quality, docker-build]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract version from tag
              id: version
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            - name: Build & push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}:latest
                      ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
